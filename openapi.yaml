openapi: 3.1.0
info:
  title: Plus IT IMAP Email API
  version: 1.0.0
  description: >-
    Read-only access to the INBOX. Message IDs include the IMAP UIDVALIDITY and
    UID, so an ID becomes invalid if the mailbox is recreated. Use this schema
    when configuring a private GPT Action.
servers:
  - url: https://imap-plus-it.netlify.app
security:
  - bearerAuth: []
paths:
  /emails:
    get:
      operationId: listEmails
      summary: Search INBOX messages
      description: Search by sender, subject, and inclusive/exclusive date bounds.
      parameters:
        - name: from
          in: query
          description: Case-insensitive IMAP match against the From field.
          schema:
            type: string
            maxLength: 200
        - name: subject
          in: query
          description: Case-insensitive IMAP match against the Subject field.
          schema:
            type: string
            maxLength: 200
        - name: since
          in: query
          description: Received date lower bound, inclusive, in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: before
          in: query
          description: Received date upper bound, exclusive, in YYYY-MM-DD format.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: Maximum number of results.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Most recent matching messages first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/ImapFailure'
  /emails/{id}:
    get:
      operationId: getEmail
      summary: Read one INBOX message
      description: >-
        Returns metadata and a bounded text body. The INBOX is opened read-only
        and the body is fetched with IMAP BODY.PEEK so the Seen flag is preserved.
      parameters:
        - name: id
          in: path
          required: true
          description: ID returned by listEmails, including UIDVALIDITY and UID.
          schema:
            type: string
            pattern: '^v1\\.[0-9]+\\.[1-9][0-9]*$'
      responses:
        '200':
          description: Message metadata and text body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Email'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: ID is obsolete or message does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/ImapFailure'
  /emails/{id}/attachments/{attachmentId}:
    get:
      operationId: downloadAttachment
      summary: Download one INBOX attachment
      description: Downloads an attachment identified by its MIME part ID from a message ID returned by listEmails or getEmail.
      parameters:
        - name: id
          in: path
          required: true
          description: Message ID returned by listEmails.
          schema:
            type: string
            pattern: '^v1\\.[0-9]+\\.[1-9][0-9]*$'
        - name: attachmentId
          in: path
          required: true
          description: MIME part ID listed in the message attachments array, such as 2 or 1.2.
          schema:
            type: string
            pattern: '^[0-9]+(\\.[0-9]+)*$'
      responses:
        '200':
          description: Attachment bytes.
          content:
            application/octet-stream: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Message or attachment ID is obsolete or does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Attachment exceeds the 25 MiB download limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/ImapFailure'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: IMAP_AUTH_CHECK_TOKEN
  schemas:
    EmailSummary:
      type: object
      required: [id, from, subject, date]
      properties:
        id:
          type: string
          example: v1.123456789.42
        from:
          type: string
        subject:
          type: string
        date:
          type: string
          format: date-time
          nullable: true
    Email:
      allOf:
        - $ref: '#/components/schemas/EmailSummary'
        - type: object
          required: [to, cc, body, contentType, bodyTruncated, attachments]
          properties:
            to:
              type: string
            cc:
              type: string
            body:
              type: string
              description: Text body, limited to 256 KiB and without attachments.
            contentType:
              type: string
              nullable: true
            bodyTruncated:
              type: boolean
            attachments:
              type: array
              description: Attachment metadata only; file contents are not downloaded by this route.
              items:
                type: object
                required: [id, filename, contentType, size]
                properties:
                  id:
                    type: string
                    description: IMAP MIME part identifier for a future attachment download route.
                  filename:
                    type: string
                  contentType:
                    type: string
                  size:
                    type: integer
                    nullable: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid query parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ImapFailure:
      description: IMAP connection or operation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
